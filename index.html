<!DOCTYPE html>
<html lang="mn" class="transition-colors duration-300">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS Safari date/week/month input FIX */
        input[type="date"],
        input[type="week"],
        input[type="month"] {
            -webkit-appearance: none;
            appearance: none;

            width: 100%;
            box-sizing: border-box;

            height: 44px;
            /* iOS стандарт */
            line-height: 44px;

            padding-top: 0 !important;
            /* 🔴 босоо padding устгана */
            padding-bottom: 0 !important;
            padding-left: 12px;
            padding-right: 12px;

            font-size: 16px !important;
            /* ⚠️ заавал 16px */
        }
    </style>
    <script>
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: "class"
        };
    </script>


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">


    <!-- ================= LOGIN ================= -->
    <div id="loginPage" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white dark:bg-gray-800 w-full max-w-sm p-6 rounded-2xl shadow">
            <h1 class="text-xl font-semibold text-center mb-6">📱 Нэвтрэх</h1>

            <input id="phoneInput" type="tel" placeholder="Утасны дугаар" class="w-full p-3 border rounded-xl mb-4 text-lg
             bg-white dark:bg-gray-700
             text-gray-900 dark:text-gray-100
             border-gray-300 dark:border-gray-600" />

            <button id="loginBtn" onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-xl text-lg
             flex items-center justify-center gap-2
             disabled:opacity-70">
                <span id="loginBtnText">Нэвтрэх</span>
                <svg id="loginSpinner" class="hidden h-5 w-5 animate-spin" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" fill="none" stroke="currentColor"
                        stroke-width="4" />
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
                </svg>
            </button>

            <p id="loginError" class="hidden text-red-500 text-center mt-3">
                Утасны дугаар бүртгэлгүй байна
            </p>
        </div>
    </div>

    <!-- ================= APP ================= -->
    <div id="appPage" class="hidden max-w-md mx-auto p-4">

        <!-- NAVBAR -->
        <div class="flex justify-between items-center mb-4">
            <div>
                <p id="userName" class="font-semibold text-lg"></p>
                <p id="userGroup" class="text-sm text-gray-500 dark:text-gray-400"></p>
            </div>

            <div class="flex items-center gap-2">

                <!-- 🌗 Auto / Manual selector -->
                <select id="themeModeSelect" class="border rounded px-2 py-1 text-sm bg-white dark:bg-gray-800">
                    <option value="auto">🌗 Auto</option>
                    <option value="light">☀️ Light</option>
                    <option value="dark">🌙 Dark</option>
                </select>

                <button onclick="logout()" class="text-red-500 text-sm">
                    Гарах
                </button>
            </div>
        </div>

        <!-- MODE -->
        <div class="flex gap-2 mb-3">
            <button id="btnDay" onclick="setMode('day')"
                class="mode-btn bg-blue-600 text-white px-4 py-2 rounded-xl">Өдөр</button>
            <button id="btnWeek" onclick="setMode('week')"
                class="mode-btn bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded-xl">7 хоног</button>
            <button id="btnMonth" onclick="setMode('month')"
                class="mode-btn bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded-xl">Сар</button>
        </div>

        <!-- SETTINGS -->
        <div class="flex items-center justify-between mb-3">
            <label class="flex items-center gap-2 text-sm">
                <input id="notifToggle" type="checkbox" class="accent-blue-600" />
                🔔 Мэдэгдэл
            </label>

            <label class="flex items-center gap-2 text-sm">
                <input id="reminderToggle" type="checkbox" class="accent-blue-600" />
                ⏰ 05:00 / 20:00
            </label>
        </div>

        <!-- FILTER -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow space-y-3">
            <input id="dateDay" type="date" class="w-full h-[44px] px-3 border rounded-xl
  bg-white dark:bg-gray-800
  text-gray-900 dark:text-gray-100
  border-gray-300 dark:border-gray-600
  text-[16px]" />
            <input id="dateWeek" type="week" class="hidden w-full h-[44px] px-3 border rounded-xl
  bg-white dark:bg-gray-800
  text-gray-900 dark:text-gray-100
  border-gray-300 dark:border-gray-600
  text-[16px]" />
            <input id="dateMonth" type="month" class="hidden w-full h-[44px] px-3 border rounded-xl
  bg-white dark:bg-gray-800
  text-gray-900 dark:text-gray-100
  border-gray-300 dark:border-gray-600
  text-[16px]" />
            <input id="groupInput" type="number" class="w-full p-3 border rounded-xl bg-white dark:bg-gray-800
            text-gray-900 dark:text-gray-100
            border-gray-300 dark:border-gray-600 " />

            <button onclick="loadAttendance()" class="w-full bg-blue-600 text-white py-3 rounded-xl">
                Харах
            </button>

            <!-- 👑 Зөвхөн admin-д -->
            <button id="btnAddPerson" class="bg-green-600 text-white px-4 rounded-xl hidden
         flex items-center gap-2 justify-center">
                <span class="text-lg">+</span>
                <span>👤</span>
            </button>


        </div>

        <!-- ===== PEOPLE MODAL ===== -->
        <div id="personModal" class="fixed inset-0 hidden bg-black/40 z-50 flex items-center justify-center">
            <div class="bg-white rounded-2xl w-96 p-5 shadow-lg">
                <h2 id="personModalTitle" class="text-lg font-semibold mb-4">Хүн нэмэх</h2>

                <input id="personId" type="hidden" />

                <div class="space-y-3">
                    <input id="personCode" class="w-full border rounded px-3 py-2" placeholder="Код" />
                    <input id="personName" class="w-full border rounded px-3 py-2" placeholder="Нэр" />
                    <input id="personAlias" class="w-full border rounded px-3 py-2" placeholder="Alias" />
                    <input id="phone" class="w-full border rounded px-3 py-2" placeholder="Phone" />
                    <input id="personGroup" type="number" class="w-full border rounded px-3 py-2" placeholder="Аравт" />
                </div>

                <div class="mt-5 flex justify-end gap-2">
                    <button onclick="closePersonModal()" class="px-4 py-2 rounded bg-gray-200">
                        Болих
                    </button>
                    <button onclick="savePerson()" class="px-4 py-2 rounded bg-blue-600 text-white">
                        Хадгалах
                    </button>
                </div>
            </div>
        </div>

        <!-- CHART -->
        <div class="mt-4 bg-white dark:bg-gray-800 p-4 rounded-2xl shadow">
            <div class="flex justify-between items-center mb-2">
                <p class="font-semibold">📊 График</p>
                <button id="toggleChartBtn" onclick="toggleChart()" class="text-sm font-medium
         text-blue-600 hover:text-blue-700
         dark:text-blue-400 dark:hover:text-blue-300">
                    Нуух
                </button>
            </div>
            <div id="chartWrap">
                <canvas id="chartCanvas" height="180"></canvas>
            </div>
        </div>

        <!-- RESULT -->
        <div id="loading" class="hidden text-center text-gray-500 mt-4">
            ⏳ Ачааллаж байна...
        </div>
        <div id="result" class="mt-4 space-y-3"></div>
    </div>

    <!-- 🚀 ENTRY POINT -->
    <script type="module" src="./js/main.js"></script>

</body>

</html>
